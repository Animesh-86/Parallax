spring.application.name=parallax
spring.config.import=optional:file:.env[.properties]

# ============================================================
# DATABASE — File-based H2 (survives restarts) / PostgreSQL for prod
# ============================================================
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/parallax;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
app.user.banned-words=admin,support,root,system,postmaster

# ============================================================
# OAUTH2 PROVIDERS
# ============================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google


spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/github


# ============================================================
# JWT
# ============================================================
app.jwt.secret=${JWT_SECRET}

app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000


# ============================================================
# CODE RUNNER — Docker images & limits
# ============================================================
code.runner.python-image=parallax-python-runner
code.runner.java-image=parallax-java-runner
code.runner.cpp-image=parallax-cpp-runner
code.runner.js-image=parallax-js-runner
code.session.image-name=parallax-workspace
code.runner.base-path=C:/parallax_sessions

# Run code limits
code.runner.max-output-bytes=65536

# ============================================================
# STORAGE
# ============================================================
parallax.storage.root=${user.home}/parallax
parallax.storage.sessions=${parallax.storage.root}/sessions
parallax.storage.projects=${parallax.storage.root}/projects
parallax.storage.avatars=${parallax.storage.root}/avatars

# ============================================================
# SERVER
# ============================================================
server.address=0.0.0.0
server.port=8080
server.servlet.context-path=/api/v1
server.server-header=
server.compression.enabled=true
server.compression.mime-types=application/json,application/javascript,text/html,text/css,text/plain
server.compression.min-response-size=1024
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# ============================================================
# OPENAPI / SWAGGER
# ============================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.path=/v3/api-docs

code.runner.base-path=/var/code_sessions

# ============================================================
# ACTUATOR — Health, info, and metrics endpoints
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

# ============================================================
# FLYWAY — Database migrations (disabled for H2 dev mode)
# Enable when using PostgreSQL:
#   spring.flyway.enabled=true
#   spring.flyway.locations=classpath:db/migration
# ============================================================
spring.flyway.enabled=false

# ============================================================
# AI & GITHUB INTEGRATION
# ============================================================
spring.ai.openai.api-key=${AI_API_KEY}
spring.ai.openai.base-url=${AI_BASE_URL:https://api.groq.com/openai/v1}
spring.ai.openai.chat.options.model=${AI_MODEL:llama-3.3-70b-versatile}
spring.ai.retry.max-attempts=1
github.pat=${GITHUB_PAT:dummy-pat}
