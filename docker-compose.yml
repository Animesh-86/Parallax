version: '3.8'

services:
  traefik:
    image: traefik:v2.10
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=parallax-workspace-network"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - parallax-network
      - parallax-workspace-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - parallax-network

networks:
  parallax-network:
    name: parallax-network
    driver: bridge
    internal: true  # Infrastructure-only — not routable to external network
  parallax-workspace-network:
    name: parallax-workspace-network
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"  # Block inter-container communication
      com.docker.network.bridge.enable_ip_masquerade: "true"  # Allow internet egress (filtered by iptables)
