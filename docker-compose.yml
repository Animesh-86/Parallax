version: '3.8'

services:
  traefik:
    image: traefik:v2.10
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8081:8080" # Traefik Dashboard
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - parallax-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - parallax-network

networks:
  parallax-network:
    name: parallax-network
    driver: bridge
